name: CI Streamlit (ancienne version)

on:
  push:
    branches: [main]
    paths: ["legacy/streamlit/**", ".github/workflows/ci-legacy.yml"]
  pull_request:
    paths: ["legacy/streamlit/**", ".github/workflows/ci-legacy.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/streamlit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            legacy/streamlit/requirements.txt
            legacy/streamlit/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint
        run: ruff check --isolated --select F .
      - name: Test
        run: pytest -q
