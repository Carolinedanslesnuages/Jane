name: CI web

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/ci-web.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jane
          POSTGRES_PASSWORD: jane_ci_password
          POSTGRES_DB: jane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jane -d jane"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jane:jane_ci_password@localhost:5432/jane?schema=public
      KEYCLOAK_URL: http://localhost:8180
      KEYCLOAK_REALM: jane
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm test
      - run: npm run build
