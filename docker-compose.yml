# Services de développement : base de données PostgreSQL.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jane_dev_password}
      POSTGRES_DB: jane
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jane -d jane"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
